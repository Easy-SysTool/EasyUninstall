name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release, x64)
        run: dotnet build src/EasyUninstall/EasyUninstall.csproj -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/EasyUninstall.Tests/EasyUninstall.Tests.csproj -p:Platform=x64
